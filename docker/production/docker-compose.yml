services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ../../backups:/app/backups:ro
      - ../../user-avatars:/app/user-avatars
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Postgres connection inside the compose network.
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Database__ApplyMigrationsOnStartup: "true"
      Https__UseRedirection: "${HTTPS_USE_REDIRECTION:-false}"
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Key: ${JWT_KEY}
      # Ozon RF credentials (fallback). DB integration settings override these when saved in UI.
      Ozon__BaseUrl: ${OZON_BASE_URL}
      Ozon__ClientId: ${OZON_CLIENT_ID}
      Ozon__ApiKey: ${OZON_API_KEY}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      Admin__PublicAdminerUrl: ${ADMINER_PUBLIC_URL:-}
      Admin__PostgresUser: ${POSTGRES_USER}
      Admin__PostgresDatabase: ${POSTGRES_DB}

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_BIND:-127.0.0.1}:${ADMINER_PORT:-8082}:8080"

  postgres-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ../../backups:/backups
      - ../backup/postgres-backup.sh:/usr/local/bin/postgres-backup.sh:ro
    command: ["sh", "/usr/local/bin/postgres-backup.sh"]

volumes:
  postgres_data:
